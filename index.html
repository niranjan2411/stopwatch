<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stopwatch</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23FDB813' stroke='%23000' stroke-width='3'/%3E%3Ccircle cx='50' cy='50' r='5' fill='%23000'/%3E%3Cline x1='50' y1='50' x2='50' y2='20' stroke='%23000' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='50' y1='50' x2='70' y2='50' stroke='%23000' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: black;
      color: #e09b06;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 2rem;
    }
    .card {
        margin-top: 25vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      background: black;
      border-radius: 16px;
      padding: 2rem;
      width: min(400px, 90vw);
      text-align: center;
    }
    h1 {
        color: white;
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .time {
      font-size: 5rem;
      font-weight: 700;
      margin: 1rem 0;
      font-variant-numeric: tabular-nums;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    button {
      background: #1e293b;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.8rem 2rem;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    button:hover {
      background: #334155;
    }
    button.primary {
      background: #ac8b21;
      color: #000000;
      border: none;
    }
    button.primary {
        border: 1px solid rgba(255, 255, 255, 0.536);
         padding: 0.8rem 5rem;
         background: #ac8b21;
    }
 
    .laps {
      margin-top: 1rem;
      max-height: 150px;
      overflow-y: auto;
      text-align: left;
      font-size: 0.9rem;
      color: white;
    }
    .lap {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 0.25rem 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Stopwatch</h1>
    <div id="display" class="time">00:00:00.000</div>
    <div class="controls">
      <button id="startStop" class="primary">Start</button>
      <button id="lap">Lap</button>
      <button id="reset">Reset</button>
    </div>
    <div id="laps" class="laps"></div>
  </div>

  <script>
    const display = document.getElementById("display");
    const startStopBtn = document.getElementById("startStop");
    const lapBtn = document.getElementById("lap");
    const resetBtn = document.getElementById("reset");
    const lapsContainer = document.getElementById("laps");
    const STORAGE_KEY = "stopwatch_state";

    let startTime = null;
    let elapsed = 0;
    let running = false;
    let laps = [];
    let intervalId = null;


    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      elapsed = state.elapsed || 0;
      laps = state.laps || [];
      renderDisplay(elapsed);
      renderLaps();
    }

    startStopBtn.onclick = () => {
      if (!running) {
        startTime = Date.now() - elapsed;
        running = true;
        startStopBtn.textContent = "Pause";
        startStopBtn.style.backgroundColor = "#1e293b";
        startStopBtn.style.color = "#ffffff";
        intervalId = setInterval(updateDisplay, 100);
      } else {
        running = false;
        clearInterval(intervalId);
        updateDisplay(); // finalize display
        startStopBtn.textContent = "Start";
        startStopBtn.style.backgroundColor = "#ac8b21";
        saveState();
      }
    };

    resetBtn.onclick = () => {
      running = false;
      clearInterval(intervalId);
      elapsed = 0;
      laps = [];
      startStopBtn.textContent = "Start";
      renderDisplay(elapsed);
      renderLaps();
      saveState();
    };

    lapBtn.onclick = () => {
      if (!running) return;
      const now = Date.now() - startTime;
      laps.unshift(now);
      renderLaps();
      saveState();
    };

    function updateDisplay() {
      if (running) {
        elapsed = Date.now() - startTime;
        renderDisplay(elapsed);
        document.title = formatTime(elapsed) + " — Stopwatch";
      } else {
        document.title = "Stopwatch";
      }
    }

    function renderDisplay(ms) {
      display.textContent = formatTime(ms);
    }

    function formatTime(ms) {
      const total = Math.floor(ms);
      const milli = total % 1000;
      const s = Math.floor(total / 1000) % 60;
      const m = Math.floor(total / 60000) % 60;
      const h = Math.floor(total / 3600000);
      return `${pad(h)}:${pad(m)}:${pad(s)}.${String(milli).padStart(3, "0")}`;
    }

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function renderLaps() {
      lapsContainer.innerHTML = "";
      if (laps.length === 0) {
        lapsContainer.textContent = "No laps yet";
        return;
      }
      laps.forEach((t, i) => {
        const div = document.createElement("div");
        div.className = "lap";
        div.innerHTML = `<span>Lap ${laps.length - i} - </span><span>${formatTime(t)}</span>`;
        lapsContainer.appendChild(div);
      });
    }

    function saveState() {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({ elapsed, laps, running: false })
      );
    }

    window.addEventListener("beforeunload", () => {
      if (running) {
        elapsed = Date.now() - startTime;
      }
      saveState();
    });

    // Keep title updated in background every 500ms
    setInterval(updateDisplay, 500);
  </script>
</body>
</html>
