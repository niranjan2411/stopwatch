<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Hours Stopwatch</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23FDB813' stroke='%23000' stroke-width='3'/%3E%3Ccircle cx='50' cy='50' r='5' fill='%23000'/%3E%3Cline x1='50' y1='50' x2='50' y2='20' stroke='%23000' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='50' y1='50' x2='70' y2='50' stroke='%23000' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="theme-toggle">
            <button id="themeBtn" aria-label="Toggle theme">
                <span class="sun-icon">☀️</span>
                <span class="moon-icon">🌙</span>
            </button>
        </div>
        
        <div class="stopwatch-display">
            <div id="display">00:00:00</div>
            <div id="milliseconds">000</div>
        </div>
        
        <div class="controls">
            <button id="startBtn" class="btn btn-start">
                <span class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
                </span>
                Start
            </button>
            <button id="stopBtn" class="btn btn-stop" style="display: none;">
                <span class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"></path></svg>
                </span>
                Stop
            </button>
            <button id="resetBtn" class="btn btn-reset">
                <span class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"></path></svg>
                </span>
                Reset
            </button>
            <button id="pipBtn" class="btn btn-pip" title="Picture-in-Picture mode">
                <span class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 7h-8v6h8V7zm4-4H1v17.98h22V3zm-2 16.02H3V4.97h18v14.05z"></path></svg>
                </span>
                PiP
            </button>
            <span class="icon" id="fullscreenBtn"  title="Toggle Fullscreen" style="font-size: 30px; margin-top: 13px;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"></path></svg>
            </span>
        
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
