<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Hours Tracker</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23FDB813' stroke='%23000' stroke-width='3'/%3E%3Ccircle cx='50' cy='50' r='5' fill='%23000'/%3E%3Cline x1='50' y1='50' x2='50' y2='20' stroke='%23000' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='50' y1='50' x2='70' y2='50' stroke='%23000' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="theme-toggle">
            <button id="themeBtn" aria-label="Toggle theme">
                <span class="sun-icon">☀️</span>
                <span class="moon-icon">🌙</span>
            </button>
        </div>
        
        <div class="header">
            <h1 class="title">Work Hours Tracker</h1>
        </div>
        
        <div class="stopwatch-display">
            <div id="display">00:00:00</div>
            <div id="milliseconds">000</div>
        </div>
        
        <div class="controls">
            <button id="startBtn" class="btn btn-start">
                <span class="btn-icon">▶</span>
                Start
            </button>
            <button id="stopBtn" class="btn btn-stop" style="display: none;">
                <span class="btn-icon">⏸</span>
                Stop
            </button>
            <button id="resetBtn" class="btn btn-reset">
                <span class="btn-icon">↻</span>
                Reset
            </button>
            <button id="pipBtn" class="btn btn-pip" title="Picture-in-Picture mode">
                <span class="btn-icon">📌</span>
                Float
            </button>
        </div>
        
        <div class="info-text">
            Data persists for 7 days after last update
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
